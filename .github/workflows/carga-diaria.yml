name: Carga diaria de mercado

# Lunes a viernes 23:30 UTC (18:30 Lima), despues del cierre de Nueva York.
on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch: {}

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_USER: ${{ secrets.API_USER }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-mercado.txt
      - run: pip install -r requirements-mercado.txt
      # El backend gratuito se duerme tras minutos sin trafico: el primer pedido lo despierta (puede tardar ~1 min).
      - name: Despertar backend
        run: |
          for i in 1 2 3 4 5 6; do
            curl -s --max-time 60 -o /dev/null -w "%{http_code}" "${{ secrets.API_URL }}/auth/me" | grep -q "^401$" && exit 0
            sleep 20
          done
          exit 1
      - run: python -m carga_mercado.run tc --dias 10 --api "${{ secrets.API_URL }}"
      - run: python -m carga_mercado.run bcrp --dias 10 --api "${{ secrets.API_URL }}"
      # Curvas SBS: las descarga el backend; si el portal las bloquea ese día, no detiene el resto de la carga
      - run: python -m carga_mercado.run curvas-sbs --api "${{ secrets.API_URL }}"
        continue-on-error: true
      - run: python -m carga_mercado.run vector-sbs --api "${{ secrets.API_URL }}"
        continue-on-error: true
      - run: python -m carga_mercado.run instrumentos --dias 10 --api "${{ secrets.API_URL }}"
      - run: python -m carga_mercado.run portafolios --api "${{ secrets.API_URL }}"
